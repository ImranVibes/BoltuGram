name: Build BoltuGram Desktop

on:
  push:
    branches:
      - main
      - master
      - dev
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Configuration (Release or Debug)'
        required: true
        default: 'Release'
        type: choice
        options:
          - Release
          - Debug

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows x64 (.exe & portable)
    runs-on: windows-2022

    steps:
      - name: Prepare Directories
        shell: cmd
        run: |
          mkdir %userprofile%\TBuild\Libraries
          mkdir %userprofile%\TBuild\ThirdParty
          mklink /d %GITHUB_WORKSPACE%\TBuild %userprofile%\TBuild
          echo TBUILD=%GITHUB_WORKSPACE%\TBuild>>%GITHUB_ENV%
          echo LibrariesPath=%GITHUB_WORKSPACE%\TBuild\Libraries\win64>>%GITHUB_ENV%

      - name: Checkout BoltuGram Source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          path: ${{ env.TBUILD }}\BoltuGram
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up MSVC Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
          toolset: '14.44'

      - name: Install Build Tools (Ninja, NASM, InnoSetup)
        shell: cmd
        run: |
          choco install ninja nasm innosetup 7zip.install -y --no-progress
          pip install meson ninja pywin32 six

      - name: Add Tools to PATH
        shell: pwsh
        run: |
          echo "C:\Program Files\NASM" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          echo "C:\Program Files (x86)\Inno Setup 6" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Cache ThirdParty
        id: cache-thirdparty
        uses: actions/cache@v4
        with:
          path: ${{ env.TBUILD }}\ThirdParty
          key: ${{ runner.os }}-x64-thirdparty-${{ hashFiles('**/Telegram/build/prepare/prepare.py') }}
          restore-keys: ${{ runner.os }}-x64-thirdparty-

      - name: Cache Libraries
        id: cache-libs
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.LibrariesPath }}\*
            !${{ env.LibrariesPath }}\cache_keys
            !${{ env.LibrariesPath }}\[qQ]t[_-]*
            ${{ env.LibrariesPath }}\cache_keys\*
            !${{ env.LibrariesPath }}\cache_keys\[qQ]t[_-]*
          key: ${{ runner.os }}-x64-libs-v1-${{ hashFiles('**/Telegram/build/prepare/prepare.py') }}
          restore-keys: ${{ runner.os }}-x64-libs-v1-

      - name: Cache Qt
        id: cache-qt
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.LibrariesPath }}\[qQ]t[_-]*
            ${{ env.LibrariesPath }}\cache_keys\[qQ]t[_-]*
          key: ${{ runner.os }}-x64-qt6-${{ hashFiles('**/Telegram/build/prepare/prepare.py') }}
          restore-keys: ${{ runner.os }}-x64-qt6-

      - name: Prepare Libraries
        shell: cmd
        run: |
          cd %TBUILD%\BoltuGram\Telegram\build\prepare
          call win.bat skip-release silent qt6

      - name: Configure CMake
        shell: cmd
        run: |
          cd %TBUILD%\BoltuGram\Telegram
          call configure.bat x64 qt6 -D TDESKTOP_API_ID=38654520 -D TDESKTOP_API_HASH=f874a438458c029b2b1d2ce1b8d30597 -D CMAKE_CONFIGURATION_TYPES=${{ github.event.inputs.build_type || 'Release' }} -D DESKTOP_APP_DISABLE_CRASH_REPORTS=ON

      - name: Build BoltuGram
        shell: cmd
        run: |
          cmake --build %TBUILD%\BoltuGram\out --config ${{ github.event.inputs.build_type || 'Release' }} --target Telegram --parallel

      - name: Package Windows Artifacts
        id: package
        shell: pwsh
        run: |
          $buildConfig = "${{ github.event.inputs.build_type || 'Release' }}"
          $baseDir = "${{ env.TBUILD }}/BoltuGram"
          $distDir = "$baseDir/dist"
          $portableDir = "$distDir/portable"
          New-Item -ItemType Directory -Force -Path $portableDir | Out-Null
          
          # Copy binary
          $exePath = Get-ChildItem -Path "$baseDir/out" -Filter "Telegram.exe" -Recurse | Select-Object -First 1
          if ($exePath) {
            Copy-Item $exePath.FullName -Destination "$portableDir/BoltuGram.exe"
          } else {
            Write-Warning "Telegram.exe not found directly in out, checking build output"
          }
          
          $updaterPath = Get-ChildItem -Path "$baseDir/out" -Filter "Updater.exe" -Recurse | Select-Object -First 1
          if ($updaterPath) {
            Copy-Item $updaterPath.FullName -Destination "$portableDir/Updater.exe"
          }
          
          # Create Portable ZIP
          Compress-Archive -Path "$portableDir/*" -DestinationPath "$distDir/BoltuGram-Windows-x64-Portable.zip" -Force
          
          # Build Inno Setup Installer if compiler exists
          if (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe") {
            & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /dMyAppVersion=7.0.9 /dMyAppVersionFull=7.0.9 /dMyBuildTarget="win64" /dReleasePath="$portableDir" "$baseDir/Telegram/build/setup.iss"
            $setupExe = Get-ChildItem -Path $portableDir -Filter "boltusetup-x64*.exe" -Recurse | Select-Object -First 1
            if ($setupExe) {
              Move-Item $setupExe.FullName -Destination "$distDir/BoltuGram-Windows-x64-Setup.exe" -Force
            }
          }

      - name: Upload Artifacts to GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: BoltuGram-Windows-x64
          path: |
            ${{ env.TBUILD }}/BoltuGram/dist/*.zip
            ${{ env.TBUILD }}/BoltuGram/dist/*.exe
            ${{ env.TBUILD }}/BoltuGram/out/**/Telegram.exe
            ${{ env.TBUILD }}/BoltuGram/out/**/BoltuGram.exe
          if-no-files-found: warn

      - name: Create GitHub Release (On Tag Push or Main Dispatch)
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.TBUILD }}/BoltuGram/dist/BoltuGram-Windows-x64-Portable.zip
            ${{ env.TBUILD }}/BoltuGram/dist/BoltuGram-Windows-x64-Setup.exe
          name: BoltuGram Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
